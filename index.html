<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abayat Al Omara - Premium Security</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/gh/evidenceprime/html-docx-js@master/dist/html-docx.js"></script>
<style>
body{font-family:tahoma;padding:10px;background:#fcfaf8;margin:0; -webkit-tap-highlight-color: transparent; font-size: 16px;}
.box{max-width:550px;margin:auto;background:white;padding:15px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,0.05)}
#loginPage,#mainApp{display:none}
#loginPage{display:block;text-align:center;padding:40px 20px}
h2{text-align:center;color:#6b4f44;margin:5px 0; font-size: 24px; font-weight: bold;}
.status-text{text-align:center;font-size:15px;color:#1a7a6e;margin-bottom:10px;font-weight:bold}
input,button,textarea,select{width:100%;padding:12px;margin:5px 0;border:1px solid #eee;border-radius:10px;box-sizing:border-box;font-size:16px; -webkit-appearance: none;}
.req{border: 1px solid #ff000045 !important; background: #fff5f5;}
button{background:#6b4f44;color:white;border:none;font-weight:bold;cursor:pointer; touch-action: manipulation; font-size: 16px;}
.row-grid {display: flex; gap: 5px; align-items: center;}
.row-grid > * {flex: 1;}
.size-section, .address-section {background: #fdf6f2; padding: 10px; border-radius: 12px; margin: 10px 0; display: none; border: 1px solid #e9dcd3;}
.size-grid, .address-grid {display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;}
.address-grid { grid-template-columns: repeat(2, 1fr); }
.size-grid input, .address-grid input {padding: 10px; font-size: 15px; text-align: center; margin: 0;}
.counter-box{text-align:center;background:#fdf6f2;padding:8px;border-radius:10px;margin-bottom:10px;font-size:16px;color:#4a3328;font-weight:bold;line-height:1.8}
table{width:100%;margin-top:15px;border-collapse:collapse;font-size:15px}
th{background:#fdf6f2;color:#4a3328;padding:10px;font-weight:bold;font-size:15px}
td{border-bottom:1px solid #f9f9f9;padding:10px;text-align:center;font-size:15px;color:#222}
.blocked-row {background-color: #ff000021 !important; color: #d62828; font-weight: bold;}
.debt-row {background-color: #fff3e0 !important;} 
.report-area{margin-top:20px;padding:10px;background:#fff;border:2px solid #3a5a40;border-radius:15px;display:none}
.switch{position:relative;display:inline-block;width:34px;height:18px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:20px}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:2px;bottom:2px;background-color:white;transition:.4s;border-radius:50%}
input:checked+.slider{background-color:#6b4f44}
input:checked+.slider:before{transform:translateX(16px)}
.selection-container{background:#f9f9f9;padding:10px;border-radius:10px;margin:5px 0;font-size:16px}
.selection-row {display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:10px;}
.selection-row label{display:flex;align-items:center;gap:5px;cursor:pointer;padding:5px;font-size:16px;color:#222;font-weight:bold;}
.selection-row input[type="radio"], .selection-row input[type="checkbox"]{width:22px;height:22px;margin:0;cursor:pointer;-webkit-appearance:checkbox !important;}
.selection-row input[type="radio"]{-webkit-appearance:radio !important;}
hr {border: 0; border-top: 1px solid #eee; margin: 10px 0;}

.reports-dropdown {
    background: #f1f1f1;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 10px;
    margin-top: 5px;
    display: none; 
}
.reports-dropdown h4 { margin: 0 0 10px 0; font-size: 16px; color: #4a3328; font-weight: bold; text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
.reports-dropdown .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.reports-dropdown button { font-size: 14px; padding: 10px; margin: 0; }

#viewModal, #blacklistModal {display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; overflow-y: auto;}
.modal-content {background:white; max-width:90%; width:380px; margin:20px auto; padding:20px; border-radius:15px; position:relative; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);}
.modal-detail {margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; display: flex; justify-content: space-between; font-size: 15px; color: #222;}
.modal-detail b {color: #4a3328; font-size: 15px;}
.bl-item {display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 15px;}
.modal-sizes-box {background: #fdf6f2; border: 1px solid #e9dcd3; border-radius: 10px; padding: 10px; margin-top: 5px;}
.modal-size-item {display: inline-block; width: 45%; margin-bottom: 5px; font-size: 15px; color: #222;}
.modal-size-item b {color: #4a3328;}
</style>
</head>
<body>

<div id="loginPage" class="box">
  <h2 id="loginTitle">🔐 دخول النظام الآمن</h2>
  <input id="userEmail" type="email" placeholder="الايميل">
  <input id="passInput" type="password" placeholder="كلمة السر">
  <button id="loginBtn" onclick="window.login()">دخول</button>
  <p id="loginError" style="color:red; display:none; margin-top:10px; font-size:15px; font-weight:bold;">خطأ في بيانات الدخول!</p>
</div>

<div id="viewModal">
    <div class="modal-content">
        <h3 id="modalTitle" style="text-align:center; color:#4a3328; font-size:18px; font-weight:bold;">تفاصيل الفاتورة</h3>
        <div id="modalBody"></div>
        <div class="row-grid" style="margin-top:15px">
            <button id="btnEditInv" style="background:#2a9d8f">تعديل 📝</button>
            <button id="btnDelInv" style="background:#d62828; display:none;">حذف 🗑️</button>
        </div>
        <div class="row-grid" style="margin-top:5px">
          <button id="btnWhatsApp" style="background:#25D366">واتساب 🟢</button>
          <button id="btnCopyForDriver" style="background:#0077b6">نسخ للمندوب 📋</button>
        </div>
        <button id="btnCloseModal" onclick="document.getElementById('viewModal').style.display='none'" style="background:#555; margin-top:5px">إغلاق</button>
    </div>
</div>

<div id="blacklistModal">
    <div class="modal-content">
        <h3 style="text-align:center; color:#000; font-size:18px; font-weight:bold;">إدارة المحظورين</h3>
        <input id="newBlockNum" placeholder="رقم الهاتف">
        <button onclick="window.addBlack()" style="background:#000">حظر رقم جديد 🚫</button>
        <hr>
        <div id="blList" style="max-height: 200px; overflow-y: auto;"></div>
        <button onclick="document.getElementById('blacklistModal').style.display='none'" style="background:#555; margin-top:10px">إغلاق</button>
    </div>
</div>

<div id="mainApp" class="box">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
    <div style="font-size:15px; font-weight:bold; color:#222;">
        <label class="switch"><input type="checkbox" id="langToggle" onchange="window.toggleLang()"><span class="slider"></span></label>
        <span id="langText">English</span>
    </div>
    <span id="userNameDisplay" style="font-weight:bold;color:#4a3328; font-size:15px"></span>
    <button id="logoutBtn" onclick="window.logout()" style="width:auto;padding:5px 12px;background:#ddd;color:#222;font-size:13px;font-weight:bold;">خروج</button>
  </div>
  
  <h2 id="mainTitle">عبايات الأمراء</h2>
  <div class="status-text" id="statusLine">⏳ جاري التحقق...</div>
  
  <div class="counter-box" id="counter"></div>

  <div class="row-grid">
    <input id="invNum" class="req" placeholder="رقم الفاتورة *">
    <input id="id" class="req" type="date">
  </div>

  <input id="a" placeholder="اسم الزبونة">
  <input id="b" class="req" placeholder="رقم التلفون *">
  
  <input id="addr_main" placeholder="العنوان" onclick="window.toggleAddr()" readonly style="cursor:pointer; background:#fffcf5;">
  <div id="addrSection" class="address-section">
      <div class="address-grid">
          <input id="addr_area" placeholder="المنطقة">
          <input id="addr_block" placeholder="قطعة">
          <input id="addr_street" placeholder="شارع">
          <input id="addr_jadda" placeholder="جادة">
          <input id="addr_house" placeholder="منزل">
          <input id="addr_note" placeholder="ملاحظة:">
      </div>
      <button type="button" onclick="window.confirmAddr()" style="background:#3a5a40; margin-top:8px; font-size:14px;">تأكيد العنوان</button>
  </div>

  <hr>

  <button type="button" id="btnShowSizes" onclick="window.toggleSizes()" style="background:#8d7166; font-size:14px; margin:5px 0;">✨ تفاصيل ومقاسات العباية</button>
  <div id="sizeSection" class="size-section">
    <div class="size-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 8px;">
        <input id="qty" placeholder="عدد العبايات">
        <input id="j" placeholder="رقم كود العباية">
    </div>
    <div class="size-grid">
        <input id="f1" placeholder="الكتف">
        <input id="f2" placeholder="الكم">
        <input id="f3" placeholder="الصدر">
        <input id="f" placeholder="الطول">
        <input id="f_hole" placeholder="الحفرة">
        <input id="f_shirt" placeholder="طول القميص">
        <input id="f_skirt" placeholder="طول التنورة">
        <input id="f_waist" placeholder="الخصر">
    </div>
  </div>

  <hr>

  <div class="row-grid">
    <input id="g1" class="req" placeholder="العربون *" type="number">
    <input id="g2" class="req" placeholder="المتبقي *" type="number">
    <input id="g3" placeholder="السعر الكامل" readonly style="background:#f1f1f1">
  </div>
  
  <div class="selection-container">
    <div class="selection-row">
      <label><input type="radio" name="loc" value="محل" checked> <span id="txtShop">محل</span></label>
      <label><input type="radio" name="loc" value="معرض"> <span id="txtExh">معرض</span></label>
      <label><input type="radio" name="loc" value="أونلاين"> <span id="txtOnline">أونلاين</span></label>
      <span style="color:#aaa">|</span>
      <label><input type="checkbox" id="checkOrder"> <span id="txtOrder">أوردر</span></label>
      <label><input type="checkbox" id="checkReady"> <span id="txtReady">جاهز</span></label>
    </div>
  </div>

  <textarea id="k" placeholder="ملاحظات" rows="1"></textarea>
  
  <div class="row-grid">
    <button id="btnSave" style="flex:2;">حفظ الطلب ✅</button>
    <button id="btnClear" style="background:#555;">🧹 تفريغ</button>
  </div>

  <div id="adminPanel" style="display:none; margin-top:10px">
    <button id="toggleReportsBtn" onclick="window.toggleReportsMenu()" style="background:#3a5a40; padding:12px; font-size:15px;">📊 إدارة التقارير والحسابات</button>
    
    <div id="reportsMenu" class="reports-dropdown">
        <h4>📋 اختر نوع التقرير</h4>
        <div class="btn-grid">
            <button id="btnDebt" style="background:#d62828;">💰 المديونيات</button>
            <button id="btnManageBlacklist" style="background:#000000;">🚫 المحظورين</button>
            <button id="btnMonthly" style="background:#2b5797;">📊 تقرير شهري</button>
            <button id="btnYearly" style="background:#2b5797;">📅 تقرير سنوي</button>
            <button onclick="window.showReport('محل'); window.toggleReportsMenu();" style="background:#3a5a40;">🏠 تقرير المحل</button>
            <button onclick="window.showReport('معرض'); window.toggleReportsMenu();" style="background:#3a5a40;">🏛️ تقرير المعرض</button>
            <button onclick="window.showReport('أوردر'); window.toggleReportsMenu();" style="background:#3a5a40;">📦 تقرير الأوردرات</button>
            <button onclick="window.showReport('جاهز'); window.toggleReportsMenu();" style="background:#3a5a40;">✨ تقرير الجاهز</button>
        </div>
    </div>
  </div>

  <div id="reportBox" class="report-area">
    <h3 id="reportTitle" style="text-align:center;color:#3a5a40; font-size:17px; font-weight:bold;"></h3>
    <div id="reportFilters" style="margin-bottom:10px; display:flex; gap:5px;">
        <select id="selMonth" style="flex:1;"><option value="0">كل الشهور</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select>
        <select id="selYear" style="flex:1;"></select>
    </div>
    <div id="reportSummary" style="margin-bottom:10px; font-size:14px; background:#f9f9f9; padding:8px; border-radius:10px; display:grid; grid-template-columns: 1fr 1fr; gap:5px; color:#222; font-weight:bold;"></div>
    <div id="reportContent" style="overflow-x: auto; background: white; padding: 10px;"></div>
    <div class="row-grid" style="margin-top:10px">
        <button id="btnExportWord" style="background:#2b5797; font-size:14px;">تحميل Word 📄</button>
        <button id="btnCloseReport" onclick="document.getElementById('reportBox').style.display='none'" style="background:#444;">إغلاق</button>
    </div>
  </div>

  <input id="z" placeholder="🔍 بحث سريع..." style="margin-top:15px">
  
  <table id="mainTable">
    <thead>
        <tr><th id="thInv">فاتورة</th><th id="thName">الاسم</th><th id="thLoc">المكان</th><th id="thBy">بواسطة</th><th id="thRem">السعر الكامل</th><th id="thView">عرض</th></tr>
    </thead>
    <tbody id="t"></tbody>
  </table>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDTqvxsxtpSQiKDjeHuq1tKiwov_T3Crlc",
  authDomain: "alomara-b5b95.firebaseapp.com",
  databaseURL: "https://alomara-b5b95-default-rtdb.firebaseio.com",
  projectId: "alomara-b5b95",
  storageBucket: "alomara-b5b95.firebasestorage.app",
  messagingSenderId: "208627786275",
  appId: "1:208627786275:web:3bd56f7eb2e964773b8796"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

window.d = [];
window.blacklist = [];
window.currentUser = "";
let currentLang = 'ar'; 
let onlyDebt = false;
let currentReportType = '';
let isEditingMode = false; 

const T = {
  ar: { 
    title: "عبايات الأمراء", hello: "مرحباً: ", status: "✅ متصل - الحفظ تلقائي ☁️",
    shop: "محل", exh: "معرض", online: "أونلاين", order: "أوردر", ready: "جاهز",
    inv: "رقم الفاتورة *", date: "التاريخ", customer: "اسم الزبونة", phone: "رقم التلفون *", address: "العنوان",
    qty: "عدد العبايات", code: "رقم كود العباية", sizes: "✨ تفاصيل ومقاسات العباية",
    paid: "العربون *", rem: "المتبقي *", total: "السعر الكامل", notes: "ملاحظات",
    save: "حفظ الطلب ✅", clear: "🧹 تفريغ", debt: "💰 كشف المديونيات", all: "👥 عرض الجميع",
    monthly: "📊 شهري", yearly: "📅 سنوي", black: "🚫 المحظورين", search: "🔍 بحث سريع...",
    thInv: "فاتورة", thName: "الاسم", thLoc: "المكان", thBy: "بواسطة", thRem: "السعر الكامل", thView: "عرض",
    logout: "خروج", export: "تحميل Word 📄", close: "إغلاق", details: "تفاصيل الفاتورة", edit: "تعديل 📝", del: "حذف 🗑️"
  },
  en: { 
    title: "Al Omara Abayat", hello: "Welcome: ", status: "✅ Online - Auto Save ☁️",
    shop: "Shop", exh: "Exh", online: "Online", order: "Order", ready: "Ready",
    inv: "Invoice No *", date: "Date", customer: "Customer Name", phone: "Phone No *", address: "Address",
    qty: "Qty", code: "Abaya Code", sizes: "✨ Abaya Details & Sizes",
    paid: "Paid *", rem: "Remaining *", total: "Total Price", notes: "Notes",
    save: "Save Order ✅", clear: "🧹 Clear", debt: "💰 Debt List", all: "👥 Show All",
    monthly: "📊 Monthly", yearly: "📅 Yearly", black: "🚫 Blocked", search: "🔍 Quick Search...",
    thInv: "Inv", thName: "Name", thLoc: "Location", thBy: "By", thRem: "Total Price", thView: "View",
    logout: "Logout", export: "Download Word 📄", close: "Close", details: "Invoice Details", edit: "Edit 📝", del: "Delete 🗑️"
  }
};

function isAuthorized() {
    return window.currentUser.includes('admin') || window.currentUser.includes('owner') || window.currentUser.includes('editor');
}

window.login = () => {
    const email = document.getElementById('userEmail').value;
    const pass = document.getElementById('passInput').value;
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).then(() => {
        return auth.signInWithEmailAndPassword(email, pass);
    }).catch(() => { document.getElementById('loginError').style.display='block'; });
};

window.logout = () => { auth.signOut(); location.reload(); };

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        window.currentUser = user.email.split('@')[0].toLowerCase();
        if(isAuthorized()) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('btnDelInv').style.display = 'block';
        }
        init();
    } else {
        document.getElementById('loginPage').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
    }
});

function init() {
    db.ref('abonat').on('value', s => {
        let rawData = s.exists() ? s.val() : [];
        // التأكد من تحويل البيانات لمصفوفة صحيحة في حال عادت كـ Object من Firebase
        window.d = Array.isArray(rawData) ? rawData : Object.values(rawData);
        updateYearSelect(); 
        updateCounter();
        r_table(); 
    });
    db.ref('blacklist').on('value', s => {
        let rawBlack = s.exists() ? s.val() : [];
        window.blacklist = Array.isArray(rawBlack) ? rawBlack : Object.values(rawBlack);
        r_table();
    });
}

window.toggleReportsMenu = () => {
    let m = document.getElementById('reportsMenu');
    m.style.display = (m.style.display === 'block') ? 'none' : 'block';
};

function applyLang(langCode) {
    currentLang = langCode;
    let l = T[currentLang];
    document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('langText').innerText = currentLang === 'ar' ? "English" : "عربي";
    document.getElementById('langToggle').checked = (currentLang === 'en');
    document.getElementById('mainTitle').innerText = l.title;
    document.getElementById('statusLine').innerText = l.status;
    document.getElementById('userNameDisplay').innerText = l.hello + window.currentUser;
    document.getElementById('logoutBtn').innerText = l.logout;
    document.getElementById('invNum').placeholder = l.inv;
    document.getElementById('a').placeholder = l.customer;
    document.getElementById('b').placeholder = l.phone;
    document.getElementById('addr_main').placeholder = l.address;
    document.getElementById('qty').placeholder = l.qty;
    document.getElementById('j').placeholder = l.code;
    document.getElementById('g1').placeholder = l.paid;
    document.getElementById('g2').placeholder = l.rem;
    document.getElementById('g3').placeholder = l.total;
    document.getElementById('k').placeholder = l.notes;
    document.getElementById('z').placeholder = l.search;
    document.getElementById('btnShowSizes').innerText = l.sizes;
    document.getElementById('btnSave').innerText = l.save;
    document.getElementById('btnClear').innerText = l.clear;
    document.getElementById('btnDebt').innerText = onlyDebt ? l.all : l.debt;
    document.getElementById('btnMonthly').innerText = l.monthly;
    document.getElementById('btnYearly').innerText = l.yearly;
    document.getElementById('btnManageBlacklist').innerText = l.black;
    document.getElementById('btnExportWord').innerText = l.export;
    document.getElementById('btnCloseReport').innerText = l.close;
    document.getElementById('btnCloseModal').innerText = l.close;
    document.getElementById('btnEditInv').innerText = l.edit;
    document.getElementById('btnDelInv').innerText = l.del;
    document.getElementById('modalTitle').innerText = l.details;
    document.getElementById('txtShop').innerText = l.shop;
    document.getElementById('txtExh').innerText = l.exh;
    document.getElementById('txtOnline').innerText = l.online;
    document.getElementById('txtOrder').innerText = l.order;
    document.getElementById('txtReady').innerText = l.ready;
    document.getElementById('thInv').innerText = l.thInv;
    document.getElementById('thName').innerText = l.thName;
    document.getElementById('thLoc').innerText = l.thLoc;
    document.getElementById('thBy').innerText = l.thBy;
    document.getElementById('thRem').innerText = l.thRem;
    document.getElementById('thView').innerText = l.thView;
    r_table();
}

window.toggleLang = () => { applyLang((currentLang === 'ar') ? 'en' : 'ar'); };

window.toggleAddr = () => {
    let s = document.getElementById('addrSection');
    s.style.display = (s.style.display === 'block') ? 'none' : 'block';
};

window.confirmAddr = () => {
    let area = document.getElementById('addr_area').value, block = document.getElementById('addr_block').value, street = document.getElementById('addr_street').value, jadda = document.getElementById('addr_jadda').value, house = document.getElementById('addr_house').value, note = document.getElementById('addr_note').value;
    document.getElementById('addr_main').value = `المنطقة: ${area} قطعة: ${block} شارع: ${street} جادة: ${jadda} منزل: ${house} ملاحظة: ${note}`;
    window.toggleAddr();
};

function updateCounter(){
    if(!window.currentUser) return;
    let tr=0, tp=0, cReady=0, cOrder=0, cShop=0, cExh=0; 
    window.d.forEach(u=>{
        if(!u) return;
        tr+=parseFloat(u.v2)||0; tp+=parseFloat(u.v1)||0;
        if(u.isReady) cReady++; if(u.isOrder) cOrder++;
        if(u.loc === 'محل') cShop++; if(u.loc === 'معرض') cExh++;
    });
    
    if(isAuthorized()) {
        document.getElementById('counter').innerHTML = `<div style="font-size:16px;">#${window.d.length} | Paid: ${tp.toFixed(2)} | <span style="color:red">Rem: ${tr.toFixed(2)}</span></div>
        <div style="font-size:15px; margin-top:4px; color:#333; font-weight:bold;">جاهز: ${cReady} | أوردر: ${cOrder} | محل: ${cShop} | معرض: ${cExh}</div>`;
    } else {
        document.getElementById('counter').innerHTML = `<div style="font-size:16px;">#${window.d.length} | <span style="font-size:14px">مجموع الفواتير</span></div>
        <div style="font-size:15px; margin-top:4px; color:#333; font-weight:bold;">جاهز: ${cReady} | أوردر: ${cOrder} | محل: ${cShop} | معرض: ${cExh}</div>`;
    }
}

function updateYearSelect() {
    let years = [new Date().getFullYear()];
    window.d.forEach(u => { if(u && u.id) { let y = new Date(u.id).getFullYear(); if(!years.includes(y)) years.push(y); } });
    years.sort((a,b)=> b-a);
    let h = '<option value="0">كل السنوات</option>';
    years.forEach(y => { h += `<option value="${y}">${y}</option>`; });
    document.getElementById('selYear').innerHTML = h;
}

window.showReport = (type) => {
    currentReportType = type;
    document.getElementById('reportBox').style.display = 'block';
    document.getElementById('selMonth').value = "0"; 
    document.getElementById('selYear').value = new Date().getFullYear();
    renderFilteredReport();
};

function renderFilteredReport() {
    let l = T[currentLang], selectedMonth = parseInt(document.getElementById('selMonth').value), selectedYear = parseInt(document.getElementById('selYear').value);
    let filtered = window.d.filter(u => {
        if(!u) return false;
        let dDate = new Date(u.id), mMatch = (selectedMonth === 0) ? true : (dDate.getMonth() + 1 === selectedMonth), yMatch = (dDate.getFullYear() === selectedYear), typeMatch = false;
        if(currentReportType === 'محل') typeMatch = (u.loc === 'محل');
        else if(currentReportType === 'معرض') typeMatch = (u.loc === 'معرض');
        else if(currentReportType === 'أوردر') typeMatch = (u.isOrder === true);
        else if(currentReportType === 'جاهز') typeMatch = (u.isReady === true);
        else if(currentReportType === 'monthly') typeMatch = true; 
        else if(currentReportType === 'yearly') { typeMatch = true; mMatch = true; } 
        return typeMatch && mMatch && yMatch;
    });

    let totalPaid = 0, totalRem = 0, totalVal = 0;
    let auth = isAuthorized();
    let h = `<table id="reportTable" border="1" style="width:100%; border-collapse:collapse; font-size:15px; text-align:center;">
        <thead><tr style="background:#f1f1f1"><th>${l.thInv}</th><th>${l.thName}</th><th>المدفوع</th><th>المتبقي</th><th>المجموع</th></tr></thead><tbody>`;
    
    filtered.forEach(u => {
        let p = parseFloat(u.v1) || 0, r = parseFloat(u.v2) || 0, t = parseFloat(u.v3) || 0;
        h += `<tr><td>${u.inv}</td><td>${u.n || '--'}</td><td>${auth ? p.toFixed(2) : '***'}</td><td>${auth ? r.toFixed(2) : '***'}</td><td>${auth ? t.toFixed(2) : '***'}</td></tr>`;
        totalPaid += p; totalRem += r; totalVal += t;
    });

    h += `</tbody><tfoot><tr style="background:#f9f9f9; font-weight:bold;"><td colspan="2">الإجمالي:</td><td>${auth ? totalPaid.toFixed(2) : '***'}</td><td style="color:red">${auth ? totalRem.toFixed(2) : '***'}</td><td style="color:green">${auth ? totalVal.toFixed(2) : '***'}</td></tr></tfoot></table>`;
    
    document.getElementById('reportSummary').innerHTML = auth ? 
        `<div><b>العدد:</b> ${filtered.length}</div><div><b>المدفوع:</b> ${totalPaid.toFixed(2)}</div><div style="color:red"><b>المتبقي:</b> ${totalRem.toFixed(2)}</div><div style="color:green"><b>المجموع:</b> ${totalVal.toFixed(2)}</div>` :
        `<div><b>العدد:</b> ${filtered.length}</div><div><b>المدفوع:</b> ***</div><div><b>المتبقي:</b> ***</div><div><b>المجموع:</b> ***</div>`;
    
    document.getElementById('reportTitle').innerText = "تقرير " + currentReportType;
    document.getElementById('reportContent').innerHTML = h;
}

document.getElementById('selMonth').onchange = renderFilteredReport;
document.getElementById('selYear').onchange = renderFilteredReport;
document.getElementById('btnMonthly').onclick = () => { window.showReport('monthly'); window.toggleReportsMenu(); };
document.getElementById('btnYearly').onclick = () => { window.showReport('yearly'); window.toggleReportsMenu(); };

document.getElementById('btnExportWord').onclick = () => {
    let summary = document.getElementById('reportSummary').innerHTML, content = document.getElementById('reportContent').innerHTML, title = document.getElementById('reportTitle').innerText;
    let header = `<div style="text-align:center; font-family: tahoma; direction: rtl;"><h2>${title}</h2><div style="background:#eee; padding:10px; margin-bottom:20px; border:1px solid #ccc;">${summary}</div></div>`;
    let converted = htmlDocx.asBlob(header + content);
    let link = document.createElement('a');
    link.href = URL.createObjectURL(converted);
    link.download = `Report_${title}.docx`;
    link.click();
};

window.addBlack = () => {
    let num = document.getElementById('newBlockNum').value;
    if(num) {
        if(!window.blacklist.includes(num)) {
            window.blacklist.push(num); db.ref('blacklist').set(window.blacklist);
            document.getElementById('newBlockNum').value = ''; renderBlacklist();
        } else alert("الرقم محظور بالفعل");
    }
};

window.removeBlack = (num) => {
    if(confirm("إزالة الحظر عن " + num + "؟")) {
        window.blacklist = window.blacklist.filter(n => n !== num);
        db.ref('blacklist').set(window.blacklist); renderBlacklist();
    }
};

function renderBlacklist() {
    let h = '';
    window.blacklist.forEach(num => { h += `<div class="bl-item"><span>${num}</span> <button onclick="window.removeBlack('${num}')" style="width:auto; background:#d62828; padding:5px; font-size:14px">إزالة 🔓</button></div>`; });
    document.getElementById('blList').innerHTML = h || '<p style="text-align:center; font-size:15px; color:#333;">القائمة فارغة</p>';
}

window.viewInv = (index) => {
    let u = window.d[index], l = T[currentLang], auth = isAuthorized();
    
    let sizesHTML = '';
    if (currentLang === 'ar') {
        sizesHTML = `
            <div class="modal-sizes-box">
                <div class="modal-size-item"><b>الكتف:</b> ${u.f1 || '-'}</div>
                <div class="modal-size-item"><b>الكم:</b> ${u.f2 || '-'}</div>
                <div class="modal-size-item"><b>الصدر:</b> ${u.f3 || '-'}</div>
                <div class="modal-size-item"><b>الطول:</b> ${u.f || '-'}</div>
                <div class="modal-size-item"><b>الحفرة:</b> ${u.f_hole || '-'}</div>
                <div class="modal-size-item"><b>طول القميص:</b> ${u.f_shirt || '-'}</div>
                <div class="modal-size-item"><b>طول التنورة:</b> ${u.f_skirt || '-'}</div>
                <div class="modal-size-item"><b>الخصر:</b> ${u.f_waist || '-'}</div>
            </div>
        `;
    } else {
        sizesHTML = `
            <div class="modal-sizes-box">
                <div class="modal-size-item"><b>Shoulder:</b> ${u.f1 || '-'}</div>
                <div class="modal-size-item"><b>Sleeve:</b> ${u.f2 || '-'}</div>
                <div class="modal-size-item"><b>Chest:</b> ${u.f3 || '-'}</div>
                <div class="modal-size-item"><b>Length:</b> ${u.f || '-'}</div>
                <div class="modal-size-item"><b>Armhole:</b> ${u.f_hole || '-'}</div>
                <div class="modal-size-item"><b>Shirt L:</b> ${u.f_shirt || '-'}</div>
                <div class="modal-size-item"><b>Skirt L:</b> ${u.f_skirt || '-'}</div>
                <div class="modal-size-item"><b>Waist:</b> ${u.f_waist || '-'}</div>
            </div>
        `;
    }

    document.getElementById('modalBody').innerHTML = `
        <div class="modal-detail"><b>${l.thInv}:</b> <span>${u.inv}</span></div>
        <div class="modal-detail"><b>${l.thName}:</b> <span>${u.n || '--'}</span></div>
        <div class="modal-detail"><b>${l.phone}:</b> <span>${u.p}</span></div>
        <div class="modal-detail"><b>${l.address}:</b> <span>${u.addr || '--'}</span></div>
        <div class="modal-detail"><b>العدد والكود:</b> <span>${u.qty || '1'} (Code: ${u.j || '--'})</span></div>
        <div style="margin-top:8px; font-weight:bold; color:#4a3328; font-size:15px;">${l.sizes}:</div>
        ${sizesHTML}
        <hr>
        ${auth ? `
        <div class="modal-detail"><b>${l.paid}:</b> <span>${u.v1}</span></div>
        <div class="modal-detail"><b>${l.rem}:</b> <span style="color:red; font-weight:bold;">${u.v2}</span></div>
        <div class="modal-detail"><b>${l.total}:</b> <span>${u.v3}</span></div><hr>
        <div class="modal-detail"><b>الحالة:</b> <span>${u.isOrder ? 'أوردر' : ''} ${u.isReady ? 'جاهز' : ''}</span></div>
        ` : `<div style="text-align:center; color:#555; font-size:14px; font-weight:bold;">المبالغ والحالة مخفية للصلاحيات</div><hr>`}
        <div class="modal-detail"><b>${l.notes}:</b> <span>${u.k || '--'}</span></div>`;
    document.getElementById('viewModal').style.display = 'block';
    
    document.getElementById('btnWhatsApp').onclick = () => {
        let msg = `*فـاتـورة عـبـايـات الأمـراء*%0A*رقم الفاتورة:* ${u.inv}%0A*الاسم:* ${u.n || 'غير مسجل'}%0A*العنوان:* ${u.addr || '--'}%0A${auth ? `*العربون:* ${u.v1}%0A*المتبقي:* ${u.v2}%0A*الإجمالي:* ${u.v3}%0A` : ''}شكراً لتعاملكم معنا ✨`;
        window.open(`https://wa.me/${u.p.replace(/\s+/g, '')}?text=${msg}`, '_blank');
    };
    document.getElementById('btnCopyForDriver').onclick = () => {
        navigator.clipboard.writeText(`رقم الفاتورة: ${u.inv}\nالاسم: ${u.n || '--'}\nرقم التلفون: ${u.p}\nالعنوان: ${u.addr || '--'}`).then(() => alert("✅ تم النسخ"));
    };
    document.getElementById('btnEditInv').onclick = () => {
        if(confirm("تعديل؟")) {
            isEditingMode = true; 
            ['invNum','a','b','addr_main','qty','j','f1','f2','f3','f','f_hole','f_shirt','f_skirt','f_waist','g1','g2','g3','id','k'].forEach(i => { if(document.getElementById(i)) document.getElementById(i).value = u[i] || u.v1 || u.v2 || u.v3 || ''; });
            document.getElementById('invNum').value = u.inv; document.getElementById('a').value = u.n || ''; document.getElementById('b').value = u.p; document.getElementById('g1').value = u.v1; document.getElementById('g2').value = u.v2; document.getElementById('g3').value = u.v3;
            document.getElementById('checkOrder').checked = u.isOrder; document.getElementById('checkReady').checked = u.isReady;
            document.querySelectorAll('input[name="loc"]').forEach(r => { r.checked = (r.value === u.loc); });
            document.getElementById('viewModal').style.display = 'none';
        }
    };
    document.getElementById('btnDelInv').onclick = () => {
        if(confirm("حذف الفاتورة؟")) {
            window.d.splice(index, 1); db.ref('abonat').set(window.d);
            document.getElementById('viewModal').style.display = 'none';
        }
    };
};

window.toggleSizes = () => {
    let s = document.getElementById('sizeSection');
    s.style.display = (s.style.display === 'block') ? 'none' : 'block';
};

document.getElementById('g1').oninput = document.getElementById('g2').oninput = () => {
    let p = parseFloat(document.getElementById('g1').value) || 0;
    let r = parseFloat(document.getElementById('g2').value) || 0;
    document.getElementById('g3').value = (p + r).toFixed(2);
};

document.getElementById('btnManageBlacklist').onclick = () => {
    renderBlacklist();
    document.getElementById('blacklistModal').style.display = 'block';
    window.toggleReportsMenu();
};

document.getElementById('btnDebt').onclick = () => {
    onlyDebt = !onlyDebt;
    document.getElementById('btnDebt').innerText = onlyDebt ? T[currentLang].all : T[currentLang].debt;
    r_table();
    window.toggleReportsMenu();
};

document.getElementById('z').oninput = r_table;

function r_table() {
    let q = document.getElementById('z').value.toLowerCase(), h = '', l = T[currentLang];
    let list = window.d.slice().reverse();
    list.forEach((u, i) => {
        if(!u) return;
        let realIndex = window.d.length - 1 - i;
        if(onlyDebt && (parseFloat(u.v2) || 0) <= 0) return;
        if(q && !JSON.stringify(u).toLowerCase().includes(q)) return;
        let isBlocked = window.blacklist.includes(u.p);
        let rowClass = isBlocked ? 'blocked-row' : ((parseFloat(u.v2) || 0) > 0 ? 'debt-row' : '');
        let tags = `${u.isOrder ? '📦' : ''}${u.isReady ? '✨' : ''}`;
        h += `<tr class="${rowClass}"><td>${u.inv}</td><td>${u.n || '--'} ${isBlocked ? '🚫' : ''}</td><td>${u.loc || '--'} ${tags}</td><td style="font-size:13px;">${u.by || '--'}</td><td>${isAuthorized() ? (u.v3 || '0') : '***'}</td><td><button onclick="window.viewInv(${realIndex})" style="padding:4px 8px; font-size:13px; width:auto;">👁️</button></td></tr>`;
    });
    document.getElementById('t').innerHTML = h || `<tr><td colspan="6" style="text-align:center; color:#555; font-size:15px; padding:20px;">لا توجد بيانات</td></tr>`;
}

document.getElementById('btnSave').onclick = () => {
    let inv = document.getElementById('invNum').value, phone = document.getElementById('b').value, paid = document.getElementById('g1').value, rem = document.getElementById('g2').value;
    if(!inv || !phone || !paid || !rem) {
        ['invNum','b','g1','g2'].forEach(id => { if(!document.getElementById(id).value) document.getElementById(id).classList.add('req'); });
        alert("يرجى تعبئة الحقول المطلوبة *"); return;
    }
    if(window.blacklist.includes(phone)) { alert("🚫 هذا الرقم محظور!"); return; }
    
    let existing = window.d.findIndex(u => u && u.inv === inv);
    
    if (existing !== -1 && !isEditingMode) {
        alert("⚠️ رقم الفاتورة هذا مسجل مسبقاً في النظام! يرجى استخدام رقم آخر.");
        return;
    }
    
    let obj = {
        inv, n: document.getElementById('a').value, p: phone,
        addr: document.getElementById('addr_main').value,
        qty: document.getElementById('qty').value, j: document.getElementById('j').value,
        f1: document.getElementById('f1').value, f2: document.getElementById('f2').value,
        f3: document.getElementById('f3').value, f: document.getElementById('f').value,
        f_hole: document.getElementById('f_hole').value, f_shirt: document.getElementById('f_shirt').value,
        f_skirt: document.getElementById('f_skirt').value, f_waist: document.getElementById('f_waist').value,
        v1: paid, v2: rem, v3: document.getElementById('g3').value,
        id: document.getElementById('id').value, k: document.getElementById('k').value,
        loc: document.querySelector('input[name="loc"]:checked').value,
        isOrder: document.getElementById('checkOrder').checked,
        isReady: document.getElementById('checkReady').checked,
        by: window.currentUser
    };
    
    if(existing !== -1) { window.d[existing] = obj; } else { window.d.push(obj); }
    
    // إعادة تعيين الفلاتر فوراً لضمان عدم حجب الفاتورة الجديدة في الجدول
    onlyDebt = false;
    document.getElementById('z').value = '';
    document.getElementById('btnDebt').innerText = T[currentLang].debt;

    db.ref('abonat').set(window.d).then(() => {
        alert("✅ تم الحفظ");
        clearForm();
    });
};

document.getElementById('btnClear').onclick = clearForm;

function clearForm() {
    isEditingMode = false; 
    ['invNum','a','b','addr_main','addr_area','addr_block','addr_street','addr_jadda','addr_house','addr_note','qty','j','f1','f2','f3','f','f_hole','f_shirt','f_skirt','f_waist','g1','g2','g3','k'].forEach(id => { document.getElementById(id).value = ''; });
    document.getElementById('id').value = new Date().toISOString().split('T')[0];
    document.querySelector('input[name="loc"][value="محل"]').checked = true;
    document.getElementById('checkOrder').checked = false;
    document.getElementById('checkReady').checked = false;
    document.getElementById('addrSection').style.display = 'none';
    document.getElementById('sizeSection').style.display = 'none';
}

// Set today's date on load
document.getElementById('id').value = new Date().toISOString().split('T')[0];
</script>
